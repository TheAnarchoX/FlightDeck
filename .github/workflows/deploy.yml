name: Deploy to GitHub Pages

on:
  # Deploy automatically on every push to main
  push:
    branches: [main]
  # Allow manual re-deploy from the Actions tab
  workflow_dispatch:

# Required for the official Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deployments; cancel in-progress run if a newer push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages base path)
        # VITE_BASE_URL is consumed by vite.config.js to set the asset base path
        env:
          VITE_BASE_URL: /FlightDeck/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
